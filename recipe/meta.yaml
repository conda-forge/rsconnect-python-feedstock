{% set name = "rsconnect-python" %}
{% set version = "1.34.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/rsconnect_python-{{ version }}.tar.gz
  sha256: 1314caa305f0a89af60809e2c2bfef45d74e280d23fe871eee8228cd293b86a5

build:
  noarch: python
  entry_points:
    - rsconnect = rsconnect.main:cli
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - uv-build >=0.13.8,<0.14.0
  run:
    - python >={{ python_min }}
    - click >=8.0.0
    - packaging >=20.0
    - pip >=20.3  # rsconnect-python invokes pip as a subprocess
    - pyjwt >=2.15.0
    - semver >=2.0.0,<4.0.0
    - uv >=0.9.0
test:
  requires:
    - python {{ python_min }}
  imports:
    - rsconnect
  commands:
    - rsconnect version

about:
  home: https://github.com/posit-dev/rsconnect-python
  license: GPL-2.0-only
  license_family: GPL
  license_file: LICENSE.md
  summary: The rsconnect-python CLI and library

extra:
  recipe-maintainers:
    - amol-
    - aronatkins
    - tdstein
    - dbkegley
    - samperman
