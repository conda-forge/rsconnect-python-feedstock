{% set name = "rsconnect-python" %}
{% set version = "1.32.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/rsconnect_python-{{ version }}.tar.gz
  sha256: 32694f63bbb0502a13a9505e4695eda1716b0593c3a6d0613d6dcae82ce51d9a

build:
  noarch: python
  entry_points:
    - rsconnect = rsconnect.main:cli
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - uv-build >=0.9.0,<0.13.0
  run:
    - python >={{ python_min }}
    - click >=8.0.0
    - packaging >=20.0
    - pip >=10.0.0  # rsconnect-python invokes pip as a subprocess
    - pyjwt >=2.4.0
    - semver >=2.0.0,<4.0.0
    - toml >=0.10
    - typing_extensions >=4.8.0
    - uv >=0.9.0
test:
  requires:
    - python {{ python_min }}
  imports:
    - rsconnect
  commands:
    - rsconnect version

about:
  home: https://github.com/posit-dev/rsconnect-python
  license: GPL-2.0-only
  license_family: GPL
  license_file: LICENSE.md
  summary: The rsconnect-python CLI and library

extra:
  recipe-maintainers:
    - amol-
    - aronatkins
    - tdstein
    - dbkegley
    - samperman
